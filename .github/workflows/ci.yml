name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pitlane
          POSTGRES_PASSWORD: pitlane
          POSTGRES_DB: pitlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-insecure-key-not-for-production
      DB_NAME: pitlane_test
      DB_USER: pitlane
      DB_PASSWORD: pitlane
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ""
      ENABLE_AI_FEATURES: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction --no-ansi

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Django system check
        run: poetry run python manage.py check

      - name: Run migrations
        run: poetry run python manage.py migrate --run-syncdb

      - name: Run tests
        run: poetry run pytest -x -q
