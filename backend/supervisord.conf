[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ── Celery Worker ─────────────────────────────────────────────────────────────
; Processes all queues: fetch, translate, process, celery (default).
; Restarts automatically on crash (autorestart=true, startretries=5).
[program:celery-worker]
command=celery -A apps.workers worker --loglevel=info -Q fetch,translate,process,celery
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/celery-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/celery-worker-err.log
stderr_logfile_maxbytes=5MB
environment=DJANGO_SETTINGS_MODULE="config.settings.production"

; ── Celery Beat ───────────────────────────────────────────────────────────────
; Periodic task scheduler. Only ONE beat instance should run at a time.
[program:celery-beat]
command=celery -A apps.workers beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/celery-beat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/celery-beat-err.log
stderr_logfile_maxbytes=5MB
environment=DJANGO_SETTINGS_MODULE="config.settings.production"
