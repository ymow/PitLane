[tool.poetry]
name = "pitlane-backend"
version = "1.0.0"
description = "PitLane F1 News Platform Backend"
authors = ["PitLane Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.0"
djangorestframework = "^3.14"
python-i18n = "^0.3.9"
pyyaml = "^6.0"
celery = "^5.3"
fastf1 = "^3.1"
matplotlib = "^3.8"
seaborn = "^0.13"
pandas = "^2.2"
redis = "^5.0"
psycopg2-binary = "^2.9"
anthropic = "^0.18.0"
feedparser = "^6.0"
Pillow = "^10.2"
python-slugify = "^8.0"
django-cors-headers = "^4.3"
django-extensions = "^3.2"
gunicorn = "^21.2"
python-dotenv = "^1.0"
sentry-sdk = "^1.40"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-django = "^4.7"
black = "^23.12"
flake8 = "^7.0"
ruff = "^0.3"
ipython = "^8.20"

[tool.ruff]
line-length = 120
exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
